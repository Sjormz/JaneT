name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to validate and publish, for example v0.2.1'
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  prepare:
    name: Prepare release candidate
    runs-on: ubuntu-latest
    outputs:
      source-sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Validate release request
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "$GITHUB_REF" = "refs/heads/main"
          fi

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify tagged source is on main
        id: source
        shell: bash
        run: |
          SOURCE_SHA=$(git rev-parse HEAD)
          test "$SOURCE_SHA" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$SOURCE_SHA" = "$GITHUB_SHA"
          fi
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify release versions before installing dependencies
        run: |
          node --input-type=commonjs <<'NODE'
          const assert = require('node:assert/strict');
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          assert.equal(process.env.RELEASE_TAG, `v${pkg.version}`, 'Tag/package version mismatch');
          assert.equal(lock.version, pkg.version, 'Lockfile version mismatch');
          assert.equal(lock.packages[''].version, pkg.version, 'Root lockfile version mismatch');
          NODE

  verify:
    name: Verify release candidate
    needs: [prepare]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source-sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Linux desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_ENV: development

      - name: TypeScript check
        run: npm run typecheck

      - name: Run unit and component tests
        run: npm test
        env:
          JANET_TEST_PYTHON: ${{ steps.python.outputs.python-path }}

      - name: Build app
        run: npm run build

      - name: Run Electron e2e tests
        run: xvfb-run --auto-servernum npx playwright test --config playwright.config.ts
        env:
          JANET_TEST_PYTHON: ${{ steps.python.outputs.python-path }}

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: release-electron-failure-linux
          path: test-results/e2e
          retention-days: 7

  package:
    name: Package (${{ matrix.os }})
    needs: [prepare]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            build-args: --linux
          - os: macos-latest
            platform: macos
            build-args: --mac --arm64 -c.mac.identity=- -c.mac.hardenedRuntime=false -c.mac.notarize=false -c.npmRebuild=false
          - os: windows-latest
            platform: windows
            build-args: --win
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source-sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci
        env:
          NODE_ENV: development

      - name: Build app
        run: npm run build

      - name: Package installer
        run: npx electron-builder ${{ matrix.build-args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify packaged release and native terminal runtime
        run: node scripts/verify-release-artifacts.mjs ${{ matrix.platform }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.os }}-${{ env.RELEASE_TAG }}
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/*.dmg
            release/*.zip
            release/*.zip.blockmap
            release/*.AppImage
            release/*.deb
            release/latest*.yml
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Update GitHub release
    needs: [prepare, verify, package]
    runs-on: ubuntu-latest
    # Serialize publication across versions, not only reruns of the same tag.
    concurrency:
      group: release-publish
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Refuse published versions and updater downgrades
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source-sha }}
        run: |
          node --input-type=commonjs <<'NODE'
          const assert = require('node:assert/strict');
          const { execFileSync } = require('node:child_process');
          const api = (...args) => JSON.parse(execFileSync('gh', ['api', ...args], { encoding: 'utf8' }));
          const repo = `repos/${process.env.GITHUB_REPOSITORY}`;
          const tag = process.env.RELEASE_TAG;
          const releases = api('--paginate', '--slurp', `${repo}/releases?per_page=100`).flat();
          const candidate = tag.slice(1).split('.').map(BigInt);
          for (const release of releases) {
            if (release.draft) continue;
            assert.notEqual(release.tag_name, tag, 'Already published; never overwrite a release');
            if (release.prerelease || !/^v\d+\.\d+\.\d+$/.test(release.tag_name)) continue;
            const published = release.tag_name.slice(1).split('.').map(BigInt);
            const firstDifference = candidate.findIndex((part, index) => part !== published[index]);
            assert(firstDifference >= 0 && candidate[firstDifference] > published[firstDifference],
              `Refusing to publish ${tag} after ${release.tag_name}`);
          }
          // Resolve annotated and lightweight tags immediately before publication.
          const commit = api(`${repo}/commits/${encodeURIComponent(`refs/tags/${tag}`)}`);
          assert.equal(commit.sha, process.env.SOURCE_SHA, 'Release tag moved during the build');
          NODE

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          pattern: installer-*
          merge-multiple: false

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          # The action stages new releases as drafts until uploads finish.
          # Only an unpublished failed draft may have its assets replaced.
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release-artifacts/*/JaneT-Setup-*.exe
            release-artifacts/*/JaneT-Setup-*.exe.blockmap
            release-artifacts/*/JaneT-Portable-*.exe
            release-artifacts/*/JaneT-*-mac-*.dmg
            release-artifacts/*/JaneT-*-mac-*.zip
            release-artifacts/*/JaneT-*-mac-*.zip.blockmap
            release-artifacts/*/JaneT-*-linux-*.AppImage
            release-artifacts/*/JaneT-*-linux-*.deb
            release-artifacts/*/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
