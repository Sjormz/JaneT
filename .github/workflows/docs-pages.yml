name: Documentation

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/site/**'
      - 'assets/screenshots/**'
      - 'tests/e2e/public-screenshots.spec.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs-pages.yml'
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - 'assets/screenshots/**'
      - 'tests/e2e/public-screenshots.spec.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run docs:check
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/docs

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
