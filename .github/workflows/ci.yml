name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Linux desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_ENV: development

      - name: TypeScript check
        run: npm run typecheck

      - name: Run unit and component tests
        run: npm test

      - name: Build app
        run: npm run build

      - name: Run Electron e2e tests
        run: xvfb-run --auto-servernum npx playwright test --config playwright.config.ts

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: electron-failure-linux
          path: test-results/e2e
          retention-days: 7

  durable-workspace-platforms:
    name: Desktop smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_ENV: development

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run unit and component tests
        run: npm test

      - name: Build app
        run: npm run build

      - name: Run desktop workflow smoke tests
        run: npx playwright test --config playwright.config.ts tests/e2e/dev-instance.spec.ts tests/e2e/close-shutdown.spec.ts tests/e2e/pane-maximize.spec.ts tests/e2e/terminal-copy.spec.ts tests/e2e/terminal-graphics.spec.ts tests/e2e/optional-workspace-setup.spec.ts tests/e2e/editor.spec.ts tests/e2e/settings-recovery.spec.ts tests/e2e/local-terminal-recovery.spec.ts

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: electron-failure-${{ matrix.os }}
          path: test-results/e2e
          retention-days: 7
