name: PR 207 readiness diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Windows shell startup probe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install pinned npm and lockfile
        run: |
          npm install --global npm@11.17.0
          node --version
          npm --version
          npm ci
          npx --no install-electron
      - name: Build unchanged app
        run: npm run build
      - name: Measure real startup without retries
        run: npx playwright test --config playwright.config.ts tests/e2e/readiness-diagnostic.spec.ts --repeat-each=10 --retries=0
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: readiness-diagnostics
          path: test-results/
          retention-days: 7

