name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  startup-diagnostic:
    name: PR 212 macOS startup diagnosis
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: '3.12'
      - name: Install pinned npm
        run: npm install --global npm@11.17.0
      - name: Install dependencies
        run: npm ci
      - name: Install Electron
        run: npx --no install-electron
      - name: Build
        run: npm run build
      - name: Repeat startup scenarios without retries
        env:
          JANET_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
          JANET_E2E_EVENTS_PATH: ${{ github.workspace }}/test-results/electron-events.jsonl
        run: |
          npx playwright test --config playwright.config.ts tests/e2e/pane-maximize.spec.ts --grep 'workspace startup commands' --repeat-each=5 --retries=0
          cp test-results/e2e/results.xml test-results/startup-repetitions.xml
      - name: Run normal pane suite without retries
        env:
          JANET_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
          JANET_E2E_EVENTS_PATH: ${{ github.workspace }}/test-results/electron-events.jsonl
        run: npx playwright test --config playwright.config.ts tests/e2e/pane-maximize.spec.ts --retries=0
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: pr212-startup-diagnostic-macos-intel
          path: test-results/
          retention-days: 7
