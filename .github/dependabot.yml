version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: production
        # Native runtime updates need their own compatibility and packaging review.
        exclude-patterns: ['node-pty']
      development-dependencies:
        dependency-type: development
        exclude-patterns: ['electron', 'electron-builder', '@playwright/test']
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
